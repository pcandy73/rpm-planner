const h = React.createElement;
const { useState, useEffect, useRef, useCallback } = React;

const DAYS = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
const PALETTE = ["#1F3864", "#3D6EA5", "#5B8A72", "#B08D57", "#7C6A9E", "#B0575B"];
const STORAGE_KEY = "rpm-planner-data-v1";
const uid = () => Math.random().toString(36).slice(2, 10);
const clone = (o) => JSON.parse(JSON.stringify(o));

function todayAbbr() {
  const jsDay = new Date().getDay();
  const idx = (jsDay + 6) % 7;
  return DAYS[idx];
}

function seedData() {
  return {
    categories: [
      {
        id: uid(), name: "Bournemouth & Future Contracts", color: PALETTE[0],
        result: "Fully handed over at Goodwood, ready to start Bournemouth.",
        purpose: "A clean exit protects my reputation and removes distraction going into the new rotation.",
        items: [
          { id: uid(), text: "Finalise handover notes for Fire Watch schedules", star: true, done: false, days: { Mon: true, Tue: true } },
          { id: uid(), text: "Brief Mike, Ashley and Lewis on outstanding tasks", star: false, done: false, days: {} },
          { id: uid(), text: "Confirm last working day and return of kit with Jim", star: true, done: false, days: { Wed: true } },
          { id: uid(), text: "Chase Bournemouth start date and induction details", star: true, done: false, days: { Fri: true } },
        ],
      },
      {
        id: uid(), name: "Fort Restoration", color: PALETTE[2],
        result: "Card payment solution live and tested before the next event.",
        purpose: "Losing cash-only sales costs the charity money it needs for restoration work.",
        items: [
          { id: uid(), text: "Compare SumUp, Zettle and Square fees", star: true, done: false, days: { Mon: true } },
          { id: uid(), text: "Get trustee sign-off on chosen provider", star: true, done: false, days: { Wed: true } },
          { id: uid(), text: "Order card reader and test", star: true, done: false, days: { Thu: true } },
        ],
      },
    ],
    capture: [],
    routine: [],
  };
}

const storage = {
  get: async (key) => {
    const v = localStorage.getItem(key);
    return v === null ? null : { key, value: v };
  },
  set: async (key, value) => {
    localStorage.setItem(key, value);
    return { key, value };
  },
};

/* ---- cloud sync (private GitHub Gist, reliable + CORS-friendly) ---- */
const SYNC_ID_KEY = "rpm-sync-code"; // base64 of { id, token }
const GIST_FILENAME = "rpm-planner-data.json";

function encodeSyncCode(id, token) {
  return btoa(JSON.stringify({ id, token }));
}
function decodeSyncCode(code) {
  const obj = JSON.parse(atob(code.trim()));
  if (!obj.id || !obj.token) throw new Error("malformed code");
  return obj;
}

const cloudSync = {
  getSyncId: () => localStorage.getItem(SYNC_ID_KEY),
  setSyncId: (code) => localStorage.setItem(SYNC_ID_KEY, code),
  clearSyncId: () => localStorage.removeItem(SYNC_ID_KEY),

  createWithToken: async (data, token) => {
    const res = await fetch("https://api.github.com/gists", {
      method: "POST",
      headers: {
        "Authorization": "token " + token,
        "Accept": "application/vnd.github+json",
        "Content-Type": "application/json",
      },
      body: JSON.stringify({
        description: "RPM Planner sync data",
        public: false,
        files: { [GIST_FILENAME]: { content: JSON.stringify(data) } },
      }),
    });
    if (!res.ok) throw new Error("create failed: " + res.status);
    const json = await res.json();
    const code = encodeSyncCode(json.id, token);
    cloudSync.setSyncId(code);
    return code;
  },

  pull: async (code) => {
    const { id, token } = decodeSyncCode(code);
    const res = await fetch("https://api.github.com/gists/" + id, {
      headers: { "Authorization": "token " + token, "Accept": "application/vnd.github+json" },
    });
    if (!res.ok) throw new Error("pull failed: " + res.status);
    const json = await res.json();
    const file = json.files && json.files[GIST_FILENAME];
    if (!file) throw new Error("data file missing in gist");
    return JSON.parse(file.content);
  },

  push: async (code, data) => {
    const { id, token } = decodeSyncCode(code);
    const res = await fetch("https://api.github.com/gists/" + id, {
      method: "PATCH",
      headers: {
        "Authorization": "token " + token,
        "Accept": "application/vnd.github+json",
        "Content-Type": "application/json",
      },
      body: JSON.stringify({ files: { [GIST_FILENAME]: { content: JSON.stringify(data) } } }),
    });
    if (!res.ok) throw new Error("push failed: " + res.status);
  },
};

function Icon({ path, size = 20, color = "#1C2430", fill = "none", strokeWidth = 2 }) {
  return h("svg", { width: size, height: size, viewBox: "0 0 24 24", fill, stroke: color, strokeWidth, strokeLinecap: "round", strokeLinejoin: "round" },
    h("path", { d: path }));
}
const PATHS = {
  star: "M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z",
  plus: "M12 5v14M5 12h14",
  trash: "M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0-1 14a2 2 0 01-2 2H7a2 2 0 01-2-2L4 6h16z",
  chevronDown: "M6 9l6 6 6-6",
  chevronRight: "M9 6l6 6-6 6",
  circle: "M12 22a10 10 0 100-20 10 10 0 000 20z",
  checkCircle: "M22 11.08V12a10 10 0 11-5.93-9.14M22 4L12 14.01l-3-3",
  x: "M18 6L6 18M6 6l12 12",
  arrowRight: "M5 12h14M12 5l7 7-7 7",
  calendarCheck: "M8 2v4M16 2v4M3 10h18M3 6a2 2 0 012-2h14a2 2 0 012 2v13a2 2 0 01-2 2H5a2 2 0 01-2-2V6zM9 16l2 2 4-4",
  layoutGrid: "M3 3h7v7H3zM14 3h7v7h-7zM14 14h7v7h-7zM3 14h7v7H3z",
  inbox: "M22 12h-6l-2 3h-4l-2-3H2M5.45 5.11L2 12v6a2 2 0 002 2h16a2 2 0 002-2v-6l-3.45-6.89A2 2 0 0016.76 4H7.24a2 2 0 00-1.79 1.11z",
  listChecks: "M3 7l2 2 4-4M3 15l2 2 4-4M11 6h10M11 14h10",
  cloud: "M17.5 19a4.5 4.5 0 000-9 6 6 0 00-11.6 1.8A4 4 0 007 19h10.5z",
  refresh: "M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15",
  copy: "M9 9h11v11H9zM5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1",
  link: "M10 13a5 5 0 007.07 0l2.83-2.83a5 5 0 00-7.07-7.07l-1.5 1.5M14 11a5 5 0 00-7.07 0l-2.83 2.83a5 5 0 007.07 7.07l1.5-1.5",
};

function useDebouncedSave(data, ready) {
  const timer = useRef(null);
  const [status, setStatus] = useState("saved");
  useEffect(() => {
    if (!ready) return;
    setStatus("saving");
    if (timer.current) clearTimeout(timer.current);
    timer.current = setTimeout(async () => {
      try {
        await storage.set(STORAGE_KEY, JSON.stringify(data));
        const syncId = cloudSync.getSyncId();
        if (syncId) {
          try { await cloudSync.push(syncId, data); } catch (e) { /* cloud push best-effort */ }
        }
        setStatus("saved");
      } catch (e) {
        setStatus("error");
      }
    }, 400);
    return () => timer.current && clearTimeout(timer.current);
  }, [data, ready]);
  return status;
}

function App() {
  const [data, setData] = useState(null);
  const [ready, setReady] = useState(false);
  const [tab, setTab] = useState("today");
  const [showSync, setShowSync] = useState(false);

  useEffect(() => {
    (async () => {
      let localData = null;
      try {
        const res = await storage.get(STORAGE_KEY);
        localData = res && res.value ? JSON.parse(res.value) : null;
      } catch (e) { /* ignore */ }

      const syncId = cloudSync.getSyncId();
      if (syncId) {
        try {
          const remote = await cloudSync.pull(syncId);
          setData(remote);
          await storage.set(STORAGE_KEY, JSON.stringify(remote));
        } catch (e) {
          setData(localData || seedData());
        }
      } else {
        setData(localData || seedData());
      }
      setReady(true);
    })();
  }, []);

  const saveStatus = useDebouncedSave(data, ready);

  const update = useCallback((fn) => {
    setData((prev) => {
      const next = clone(prev);
      fn(next);
      return next;
    });
  }, []);

  if (!ready || !data) {
    return h("div", { style: S.loadingScreen }, h("div", { style: S.loadingText }, "Loading your plan…"));
  }

  return h("div", { style: S.app },
    h(Header, { saveStatus, onSyncClick: () => setShowSync(true) }),
    h("div", { style: S.content },
      tab === "today" && h(TodayTab, { data, update }),
      tab === "weekly" && h(WeeklyTab, { data, update }),
      tab === "capture" && h(ListTab, { data, update, listKey: "capture", hint: "Anything on your mind — task, idea, reminder. Sort it into a category during your weekly reset.", allowMove: true }),
      tab === "routine" && h(ListTab, { data, update, listKey: "routine", hint: "Admin and chores with no real Result behind them. Just do them." })
    ),
    h(TabBar, { tab, setTab }),
    showSync && h(SyncModal, { data, setData, onClose: () => setShowSync(false) })
  );
}

function Header({ saveStatus, onSyncClick }) {
  const date = new Date();
  const dateStr = date.toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long" });
  const dotColor = saveStatus === "saved" ? "#5B8A72" : saveStatus === "error" ? "#B0575B" : "#B08D57";
  return h("div", { style: S.header },
    h("div", null,
      h("div", { style: S.headerEyebrow }, "RPM PLANNER"),
      h("div", { style: S.headerDate }, dateStr)
    ),
    h("div", { style: S.headerRight },
      h("button", { style: S.syncIconBtn, onClick: onSyncClick, "aria-label": "Sync" },
        h(Icon, { path: PATHS.cloud, size: 19, color: "#4B5563" })
      ),
      h("div", { style: { ...S.saveDot, background: dotColor } })
    )
  );
}

function TabBar({ tab, setTab }) {
  const tabs = [
    { id: "today", label: "Today", path: PATHS.calendarCheck },
    { id: "weekly", label: "Weekly", path: PATHS.layoutGrid },
    { id: "capture", label: "Capture", path: PATHS.inbox },
    { id: "routine", label: "Routine", path: PATHS.listChecks },
  ];
  return h("div", { style: S.tabBar },
    tabs.map(({ id, label, path }) => {
      const active = tab === id;
      return h("button", { key: id, onClick: () => setTab(id), style: S.tabButton },
        h(Icon, { path, size: 20, color: active ? "#1F3864" : "#9AA3AF", strokeWidth: active ? 2.4 : 2 }),
        h("span", { style: { ...S.tabLabel, color: active ? "#1F3864" : "#9AA3AF", fontWeight: active ? 700 : 500 } }, label)
      );
    })
  );
}

function SyncModal({ data, setData, onClose }) {
  const [syncId, setSyncIdState] = useState(cloudSync.getSyncId());
  const [token, setToken] = useState("");
  const [codeInput, setCodeInput] = useState("");
  const [status, setStatus] = useState("");
  const [busy, setBusy] = useState(false);
  const [backupText, setBackupText] = useState("");
  const [restoreText, setRestoreText] = useState("");

  const tokenUrl = "https://github.com/settings/tokens/new?scopes=gist&description=RPM%20Planner%20Sync";

  const createSync = async () => {
    const t = token.trim();
    if (!t) { setStatus("Paste your token first (see step 1 above)."); return; }
    setBusy(true); setStatus("");
    try {
      const code = await cloudSync.createWithToken(data, t);
      setSyncIdState(code);
      setStatus("Sync turned on. Copy the code below and paste it into this same screen on your other device.");
    } catch (e) {
      console.error("RPM sync error:", e);
      setStatus("Couldn't reach the sync service (" + (e && e.message ? e.message : "unknown error") + "). Check the token has the 'gist' scope, or use Manual Backup below instead.");
    }
    setBusy(false);
  };

  const linkSync = async () => {
    const code = codeInput.trim();
    if (!code) return;
    setBusy(true); setStatus("");
    try {
      const remote = await cloudSync.pull(code);
      cloudSync.setSyncId(code);
      setSyncIdState(code);
      setData(remote);
      await storage.set(STORAGE_KEY, JSON.stringify(remote));
      setStatus("Linked. This device now shares data with that code.");
    } catch (e) {
      console.error("RPM sync link error:", e);
      setStatus("Couldn't use that code (" + (e && e.message ? e.message : "unknown error") + "). Make sure you copied the whole thing.");
    }
    setBusy(false);
  };

  const pullNow = async () => {
    if (!syncId) return;
    setBusy(true); setStatus("");
    try {
      const remote = await cloudSync.pull(syncId);
      setData(remote);
      await storage.set(STORAGE_KEY, JSON.stringify(remote));
      setStatus("Pulled the latest data.");
    } catch (e) {
      console.error("RPM sync pull error:", e);
      setStatus("Couldn't reach the sync service (" + (e && e.message ? e.message : "unknown error") + ").");
    }
    setBusy(false);
  };

  const unlink = () => {
    cloudSync.clearSyncId();
    setSyncIdState(null);
    setStatus("Sync turned off on this device. Your local data is untouched.");
  };

  const copyCode = () => {
    if (!syncId) return;
    navigator.clipboard?.writeText(syncId).then(
      () => setStatus("Code copied. Paste it into Sync & Backup on your other device."),
      () => setStatus("Couldn't copy — select and copy it manually.")
    );
  };

  const copyBackup = () => {
    const json = JSON.stringify(data, null, 2);
    setBackupText(json);
    navigator.clipboard?.writeText(json).then(
      () => setStatus("Backup copied to clipboard."),
      () => setStatus("Backup shown below — copy it manually.")
    );
  };

  const restoreBackup = () => {
    try {
      const parsed = JSON.parse(restoreText);
      if (!parsed.categories) throw new Error("bad shape");
      setData(parsed);
      setStatus("Restored from backup.");
      setRestoreText("");
    } catch (e) {
      setStatus("That didn't look like a valid backup. Check you copied the whole thing.");
    }
  };

  return h("div", { style: S.modalOverlay, onClick: onClose },
    h("div", { style: S.modalCard, onClick: (e) => e.stopPropagation() },
      h("div", { style: S.modalHeaderRow },
        h("div", { style: S.modalTitle }, "Sync & Backup"),
        h("button", { style: S.iconBtn, onClick: onClose }, h(Icon, { path: PATHS.x, size: 20, color: "#9AA3AF" }))
      ),

      h("div", { style: S.modalSectionLabel }, "CLOUD SYNC"),
      h("div", { style: S.modalHint }, "Uses a private GitHub Gist to link your devices — reliable since it's your own GitHub account, not a third-party free API."),

      syncId
        ? h("div", null,
            h("div", { style: S.modalHint }, "Your sync code — paste this into the same screen on your other device:"),
            h("div", { style: S.syncCodeBox },
              h("span", { style: S.syncCodeText }, syncId.slice(0, 28) + "…"),
              h("button", { style: S.iconBtn, onClick: copyCode }, h(Icon, { path: PATHS.copy, size: 16, color: "#1F3864" }))
            ),
            h("div", { style: S.rowButtons },
              h("button", { style: S.primaryBtn, onClick: pullNow, disabled: busy }, "Pull latest"),
              h("button", { style: S.ghostBtn, onClick: unlink }, "Turn off sync")
            )
          )
        : h("div", null,
            h("div", { style: S.modalHint },
              "Step 1 — ",
              h("a", { href: tokenUrl, target: "_blank", rel: "noopener noreferrer", style: S.linkText }, "tap here to create a free GitHub token"),
              " (just tick the 'gist' box, scroll down, Generate token, then copy it)."
            ),
            h("input", { style: S.textInput, placeholder: "Paste token here (starts with ghp_ or github_pat_)…", value: token, onChange: (e) => setToken(e.target.value) }),
            h("div", { style: { height: 10 } }),
            h("div", { style: S.modalHint }, "Step 2 — create sync on this device:"),
            h("button", { style: S.primaryBtn, onClick: createSync, disabled: busy }, busy ? "Working…" : "Turn on sync (this device)"),
            h("div", { style: { height: 16 } }),
            h("div", { style: S.modalHint }, "Already synced another device? Paste its code here instead:"),
            h("div", { style: S.rowButtons },
              h("input", { style: { ...S.textInput, flex: 1 }, placeholder: "Paste sync code…", value: codeInput, onChange: (e) => setCodeInput(e.target.value) }),
              h("button", { style: S.primaryBtnSmall, onClick: linkSync, disabled: busy }, h(Icon, { path: PATHS.link, size: 17, color: "#fff" }))
            )
          ),

      status && h("div", { style: S.syncStatus }, status),

      h("div", { style: { ...S.modalSectionLabel, marginTop: 22 } }, "MANUAL BACKUP"),
      h("div", { style: S.modalHint }, "Always works, no internet service required. Copy your full plan as text, and paste it back in on any device to restore it."),
      h("div", { style: S.rowButtons },
        h("button", { style: S.ghostBtnDark, onClick: copyBackup }, "Copy backup")
      ),
      backupText && h("textarea", { style: { ...S.textArea, minHeight: 80, marginTop: 8, fontSize: 11 }, readOnly: true, value: backupText, onClick: (e) => e.target.select() }),

      h("div", { style: { height: 14 } }),
      h("textarea", {
        style: { ...S.textArea, minHeight: 70 }, placeholder: "Paste a backup here to restore it…",
        value: restoreText, onChange: (e) => setRestoreText(e.target.value)
      }),
      h("button", { style: S.ghostBtnDark, onClick: restoreBackup, disabled: !restoreText.trim() }, "Restore from pasted backup")
    )
  );
}

function TodayTab({ data, update }) {
  const abbr = todayAbbr();
  const dueCategories = data.categories
    .map((c) => ({ ...c, items: c.items.filter((it) => it.days && it.days[abbr] && !it.done) }))
    .filter((c) => c.items.length > 0);
  const routineOpen = data.routine.filter((r) => !r.done).slice(0, 2);

  const toggleItemDone = (catId, itemId) => update((d) => {
    const cat = d.categories.find((c) => c.id === catId);
    const item = cat.items.find((i) => i.id === itemId);
    item.done = !item.done;
  });
  const toggleRoutine = (id) => update((d) => {
    const r = d.routine.find((x) => x.id === id);
    r.done = !r.done;
  });

  return h("div", { style: S.section },
    dueCategories.length === 0 && h(EmptyState, {
      pathKey: "calendarCheck", title: "Nothing scheduled for today",
      body: "Go to Weekly and assign MAP items to today's day pill."
    }),
    dueCategories.map((cat) => h("div", { key: cat.id, style: S.card },
      h("div", { style: S.cardHeaderRow },
        h("div", { style: { ...S.colorDot, background: cat.color } }),
        h("div", { style: S.cardTitle }, cat.name)
      ),
      cat.items.map((it) => h(ItemRow, { key: it.id, item: it, onToggle: () => toggleItemDone(cat.id, it.id) }))
    )),
    routineOpen.length > 0 && h("div", { style: S.card },
      h("div", { style: S.cardHeaderRow },
        h("div", { style: { ...S.colorDot, background: "#9AA3AF" } }),
        h("div", { style: S.cardTitle }, "From Routine")
      ),
      routineOpen.map((r) => h(ItemRow, { key: r.id, item: r, onToggle: () => toggleRoutine(r.id), plain: true }))
    )
  );
}

function ItemRow({ item, onToggle, plain }) {
  return h("div", { style: S.itemRow, onClick: onToggle },
    item.done
      ? h(Icon, { path: PATHS.checkCircle, size: 20, color: "#5B8A72", strokeWidth: 2.2 })
      : h(Icon, { path: PATHS.circle, size: 20, color: "#C4CAD3", strokeWidth: 2 }),
    h("span", { style: { ...S.itemText, textDecoration: item.done ? "line-through" : "none", color: item.done ? "#9AA3AF" : "#1C2430" } }, item.text),
    !plain && item.star && h(Icon, { path: PATHS.star, size: 16, color: "#B08D57", fill: "#B08D57", strokeWidth: 1.5 })
  );
}

function EmptyState({ pathKey, title, body }) {
  return h("div", { style: S.emptyState },
    h(Icon, { path: PATHS[pathKey], size: 28, color: "#9AA3AF" }),
    h("div", { style: S.emptyTitle }, title),
    h("div", { style: S.emptyBody }, body)
  );
}

function WeeklyTab({ data, update }) {
  const [expanded, setExpanded] = useState(() => new Set(data.categories.map((c) => c.id)));
  const [newCatName, setNewCatName] = useState("");
  const [addingCat, setAddingCat] = useState(false);

  const toggleExpand = (id) => setExpanded((prev) => {
    const next = new Set(prev);
    next.has(id) ? next.delete(id) : next.add(id);
    return next;
  });

  const addCategory = () => {
    const name = newCatName.trim();
    if (!name) return;
    update((d) => {
      d.categories.push({ id: uid(), name, color: PALETTE[d.categories.length % PALETTE.length], result: "", purpose: "", items: [] });
    });
    setNewCatName("");
    setAddingCat(false);
  };

  const deleteCategory = (id) => update((d) => { d.categories = d.categories.filter((c) => c.id !== id); });

  return h("div", { style: S.section },
    data.categories.map((cat) => h(CategoryCard, {
      key: cat.id, cat, expanded: expanded.has(cat.id), onToggleExpand: () => toggleExpand(cat.id),
      update, onDelete: () => deleteCategory(cat.id)
    })),
    addingCat
      ? h("div", { style: S.card },
          h("input", {
            autoFocus: true, style: S.textInput, placeholder: "Category name (e.g. Investing / Finances)",
            value: newCatName, onChange: (e) => setNewCatName(e.target.value),
            onKeyDown: (e) => e.key === "Enter" && addCategory()
          }),
          h("div", { style: S.rowButtons },
            h("button", { style: S.primaryBtn, onClick: addCategory }, "Add category"),
            h("button", { style: S.ghostBtn, onClick: () => setAddingCat(false) }, "Cancel")
          )
        )
      : h("button", { style: S.addCategoryBtn, onClick: () => setAddingCat(true) },
          h(Icon, { path: PATHS.plus, size: 18, color: "#1F3864" }),
          h("span", null, "Add category")
        )
  );
}

function CategoryCard({ cat, expanded, onToggleExpand, update, onDelete }) {
  const addItem = () => update((d) => {
    const c = d.categories.find((x) => x.id === cat.id);
    c.items.push({ id: uid(), text: "", star: false, done: false, days: {} });
  });
  const setField = (field, value) => update((d) => {
    const c = d.categories.find((x) => x.id === cat.id);
    c[field] = value;
  });
  const updateItem = (itemId, fn) => update((d) => {
    const c = d.categories.find((x) => x.id === cat.id);
    const it = c.items.find((x) => x.id === itemId);
    fn(it);
  });
  const deleteItem = (itemId) => update((d) => {
    const c = d.categories.find((x) => x.id === cat.id);
    c.items = c.items.filter((x) => x.id !== itemId);
  });

  return h("div", { style: S.card },
    h("div", { style: S.cardHeaderRow, onClick: onToggleExpand },
      h("div", { style: { ...S.colorDot, background: cat.color } }),
      h("div", { style: S.cardTitle }, cat.name),
      h(Icon, { path: expanded ? PATHS.chevronDown : PATHS.chevronRight, size: 18, color: "#9AA3AF" })
    ),
    expanded && h("div", { style: { marginTop: 10 } },
      h("label", { style: S.fieldLabel }, "RESULT"),
      h("textarea", { style: S.textArea, placeholder: "The specific outcome you want, not the task", defaultValue: cat.result, onBlur: (e) => setField("result", e.target.value) }),
      h("label", { style: S.fieldLabel }, "PURPOSE"),
      h("textarea", { style: S.textArea, placeholder: "Why it matters", defaultValue: cat.purpose, onBlur: (e) => setField("purpose", e.target.value) }),
      h("label", { style: S.fieldLabel }, "MAP"),
      cat.items.map((it) => h(MapItemEditor, { key: it.id, item: it, update: (fn) => updateItem(it.id, fn), onDelete: () => deleteItem(it.id) })),
      h("button", { style: S.addItemBtn, onClick: addItem }, h(Icon, { path: PATHS.plus, size: 15, color: "#1F3864" }), " Add MAP item"),
      h("button", { style: S.deleteCategoryBtn, onClick: onDelete }, h(Icon, { path: PATHS.trash, size: 13, color: "#C4CAD3" }), " Delete category")
    )
  );
}

function MapItemEditor({ item, update, onDelete }) {
  return h("div", { style: S.mapItemBlock },
    h("div", { style: S.mapItemTopRow },
      h("button", { onClick: () => update((it) => (it.star = !it.star)), style: S.iconBtn },
        h(Icon, { path: PATHS.star, size: 17, color: item.star ? "#B08D57" : "#C4CAD3", fill: item.star ? "#B08D57" : "none", strokeWidth: 1.5 })),
      h("input", { style: S.mapItemInput, placeholder: "Describe the action…", defaultValue: item.text, onBlur: (e) => update((it) => (it.text = e.target.value)) }),
      h("button", { onClick: onDelete, style: S.iconBtn }, h(Icon, { path: PATHS.x, size: 16, color: "#C4CAD3" }))
    ),
    h("div", { style: S.dayPillRow },
      DAYS.map((d) => {
        const active = !!(item.days && item.days[d]);
        return h("button", {
          key: d,
          onClick: () => update((it) => { it.days = { ...it.days, [d]: !(it.days && it.days[d]) }; }),
          style: { ...S.dayPill, background: active ? "#1F3864" : "#F2F4F7", color: active ? "#FFFFFF" : "#9AA3AF" }
        }, d[0]);
      })
    )
  );
}

function ListTab({ data, update, listKey, hint, allowMove }) {
  const [text, setText] = useState("");
  const list = data[listKey];

  const addEntry = () => {
    const t = text.trim();
    if (!t) return;
    update((d) => { d[listKey].push({ id: uid(), text: t, done: false }); });
    setText("");
  };
  const toggle = (id) => update((d) => {
    const it = d[listKey].find((x) => x.id === id);
    it.done = !it.done;
  });
  const remove = (id) => update((d) => { d[listKey] = d[listKey].filter((x) => x.id !== id); });
  const moveToCategory = (id, catId) => {
    if (!catId) return;
    update((d) => {
      const entry = d[listKey].find((x) => x.id === id);
      const cat = d.categories.find((c) => c.id === catId);
      if (entry && cat) {
        cat.items.push({ id: uid(), text: entry.text, star: false, done: false, days: {} });
        d[listKey] = d[listKey].filter((x) => x.id !== id);
      }
    });
  };

  return h("div", { style: S.section },
    h("div", { style: S.listHint }, hint),
    h("div", { style: S.card },
      h("div", { style: S.rowButtons },
        h("input", {
          style: { ...S.textInput, flex: 1 }, placeholder: "Add an item…", value: text,
          onChange: (e) => setText(e.target.value), onKeyDown: (e) => e.key === "Enter" && addEntry()
        }),
        h("button", { style: S.primaryBtnSmall, onClick: addEntry }, h(Icon, { path: PATHS.plus, size: 18, color: "#fff" }))
      )
    ),
    list.length === 0 && h(EmptyState, { pathKey: "inbox", title: "Nothing here", body: "Add anything on your mind above." }),
    list.map((entry) => h("div", { key: entry.id, style: S.captureCard },
      h("div", { style: S.itemRow, onClick: () => toggle(entry.id) },
        entry.done
          ? h(Icon, { path: PATHS.checkCircle, size: 20, color: "#5B8A72", strokeWidth: 2.2 })
          : h(Icon, { path: PATHS.circle, size: 20, color: "#C4CAD3", strokeWidth: 2 }),
        h("span", { style: { ...S.itemText, textDecoration: entry.done ? "line-through" : "none", color: entry.done ? "#9AA3AF" : "#1C2430" } }, entry.text),
        h("button", { onClick: (e) => { e.stopPropagation(); remove(entry.id); }, style: S.iconBtn }, h(Icon, { path: PATHS.trash, size: 15, color: "#C4CAD3" }))
      ),
      allowMove && data.categories.length > 0 && h("div", { style: S.moveRow },
        h(Icon, { path: PATHS.arrowRight, size: 13, color: "#9AA3AF" }),
        h("select", {
          style: S.moveSelect, defaultValue: "", onChange: (e) => moveToCategory(entry.id, e.target.value)
        },
          h("option", { value: "", disabled: true }, "Move to category…"),
          data.categories.map((c) => h("option", { key: c.id, value: c.id }, c.name))
        )
      )
    ))
  );
}
